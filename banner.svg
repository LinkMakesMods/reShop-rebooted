<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="reShop: a 3DS homebrew eShop remake" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#f26a1b"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#c9d1db"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)" opacity="0.7"/>
  <rect y="296" width="1280" height="24" fill="#2fb4e9"/>
  <rect y="290" width="1280" height="6" fill="#1b8fc0"/>

  <!-- Shopping bag icon -->
  <g transform="translate(120 52)">
    <ellipse cx="108" cy="206" rx="92" ry="10" fill="#000" opacity="0.12"/>
    <path d="M60 70 C60 20 156 20 156 70" fill="none" stroke="#c9531a" stroke-width="12" stroke-linecap="round"/>
    <path d="M24 70 H192 L206 196 Q208 210 194 210 H22 Q8 210 10 196 Z" fill="url(#bag)"/>
    <path d="M24 70 H192 L194 90 H22 Z" fill="#fff" opacity="0.18"/>
    <circle cx="68" cy="70" r="7" fill="#c9531a"/>
    <circle cx="148" cy="70" r="7" fill="#c9531a"/>
    <!-- Down-arrow (download) -->
    <path d="M108 112 V164 M84 142 L108 166 L132 142" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="390" y="160" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="118" font-weight="700" fill="#4a4a4a" letter-spacing="-2">re<tspan fill="#f26a1b">Shop</tspan></text>
  <text x="396" y="218" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="34" fill="#6b7480">A Nintendo 3DS homebrew eShop remake</text>
  <text x="396" y="258" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="22" fill="#8b94a0">Rebooted by LinkMakesMods · Originally by Unitendo</text>
</svg>
